<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twin Mac - Secure Admin Panel</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #050505; color: #ffffff; padding: 20px; margin: 0;
        }
        .logo-container { text-align: center; margin-bottom: 30px; font-size: 32px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 10px;}
        .logo-icon { color: #ff8c00; font-size: 36px; }
        .logo-text { color: #ffffff; }
        .logo-dot { color: #ff8c00; }

        .container-box { 
            background: #121212; padding: 25px; width: 100%; max-width: 400px; 
            border-radius: 8px; border: 1px solid #333; margin: auto;
        }
        .list-box { max-width: 1100px; margin-top: 20px; }
        .admin-dashboard { display: none; flex-wrap: wrap; gap: 20px; justify-content: center; }
        
        h3 { color: #ff8c00; margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 10px; }
        input, select, button { 
            width: 100%; padding: 12px; margin: 10px 0; 
            box-sizing: border-box; border-radius: 5px; border: 1px solid #333; 
            background: #1a1a1a; color: white; font-size: 16px;
        }
        input:focus, select:focus { outline: none; border-color: #ff8c00; }
        
        button { background: #ff8c00; color: black; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; }
        button:hover { background: #e67e00; }
        .logout-btn { background: #333; color: white; margin-top: 20px;}
        .logout-btn:hover { background: #555; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; border-bottom: 1px solid #2a2a2a; text-align: left; font-size: 14px; }
        th { color: #aaa; }
        
        .action-group { display: flex; gap: 5px; }
        .action-btn { padding: 6px 10px; font-size: 12px; width: auto; margin: 0; border-radius: 4px; color: white; }
        .btn-update { background: #ff8c00; color: black; }
        .btn-edit { background: #4a90e2; }
        .btn-delete { background: #e74c3c; }
        
        .search-bar { background: #222; border-color: #555; }
        .status-badge { padding: 3px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .bg-active { background: #4CAF50; color: white; }
        .bg-deactive { background: #555; color: white; }
        .adm-tag { background: #555; font-size: 9px; padding: 1px 4px; border-radius: 3px; color: #fff; margin-left: 5px;}
    </style>
</head>
<body>

<div class="logo-container">
    <span class="logo-icon">⚙️</span>
    <span class="logo-text">twin mac admin<span class="logo-dot">.</span></span>
</div>

<div id="loginSection" class="container-box">
    <h3 style="text-align:center;">Admin Login</h3>
    <input type="email" id="adminEmail" placeholder="Admin Email">
    <input type="password" id="adminPassword" placeholder="Password">
    <button onclick="loginAdmin()">Login</button>
</div>

<div id="adminDashboard" class="admin-dashboard">
    
    <div style="display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; width: 100%;">
        <div class="container-box" style="margin: 0;">
            <h3>1. Register New Player</h3>
            <input type="text" id="newName" placeholder="Player Name">
            <input type="text" id="newMobile" placeholder="Mobile Number">
            <input type="text" id="newTag" placeholder="Player Tag (e.g. PRO, NEW) - Optional">
            <button onclick="registerPlayer()">Register Player</button>
        </div>

        <div class="container-box" style="margin: 0;" id="updateSection">
            <h3>2. Set Player Scores</h3>
            <input type="text" id="updateMobile" placeholder="Select player below..." readonly style="background:#222; color:#aaa;">
            <hr style="border: 0; border-top: 1px solid #333; margin: 15px 0;">
            <label style="font-size: 14px; color: #ff8c00; font-weight: bold;">Enter absolute values to save:</label>
            
            <label style="font-size: 12px; color: #aaa;">Total Wins:</label>
            <input type="number" id="setWins" placeholder="Wins total score" value="0">
            
            <label style="font-size: 12px; color: #aaa;">Total Kills:</label>
            <input type="number" id="setKills" placeholder="Kills total score" value="0">
            
            <label style="font-size: 12px; color: #aaa;">Deposited Money (₹):</label>
            <input type="number" id="setDeposit" placeholder="Deposit total money" value="0">
            
            <label style="font-size: 12px; color: #aaa;">Current Wallet Balance (₹):</label>
            <input type="number" id="setBalance" placeholder="Balance total money" value="0">
            
            <button onclick="updateStats()">Save Exact Scores</button>
        </div>

        <div class="container-box" style="margin: 0; display: none; border-color: #4a90e2;" id="editSection">
            <h3 style="color: #4a90e2;">📝 Edit Details & Status</h3>
            <input type="hidden" id="editOldMobile">
            
            <label style="font-size: 14px; color: #aaa;">Player Name:</label>
            <input type="text" id="editName" placeholder="Player Name">
            
            <label style="font-size: 14px; color: #aaa;">Mobile Number:</label>
            <input type="text" id="editMobile" placeholder="Mobile Number">

            <label style="font-size: 14px; color: #aaa;">Custom Tag:</label>
            <input type="text" id="editTag" placeholder="Player Tag (PRO, ELITE, etc.)">
            
            <label style="font-size: 14px; color: #aaa;">Player Status:</label>
            <select id="editStatus">
                <option value="Auto">Auto (Active if score > 0)</option>
                <option value="Active">Force Active</option>
                <option value="Deactive">Force Deactive</option>
            </select>

            <button style="background: #4a90e2; color: white;" onclick="savePlayerProfile()">Save Changes</button>
            <button style="background: #333; color: white;" onclick="cancelEdit()">Cancel</button>
        </div>
    </div>

    <div class="container-box list-box">
        <h3>Manage Registered Players</h3>
        
        <input type="text" id="adminSearchInput" class="search-bar" placeholder="🔍 Search players by Name or Mobile number..." onkeyup="searchAdminPlayer()">

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Mobile</th>
                    <th>Status</th>
                    <th>Wins</th>
                    <th>Kills</th>
                    <th>Deposit</th>
                    <th>Bal (₹)</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="adminPlayerList">
                </tbody>
        </table>
        <div style="text-align: right;">
            <button class="logout-btn" style="width: auto; padding: 10px 20px;" onclick="logoutAdmin()">Logout</button>
        </div>
    </div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { doc, setDoc, updateDoc, collection, onSnapshot, deleteDoc, getDoc, getFirestore } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDZk4FvwMZiuWh4eKokSam20T0VD33OJmw",
      authDomain: "leader-board-2e4df.firebaseapp.com",
      projectId: "leader-board-2e4df",
      storageBucket: "leader-board-2e4df.firebasestorage.app",
      messagingSenderId: "690245888676",
      appId: "1:690245888676:web:7185e88af678a7bae39431",
      measurementId: "G-NGC92PGBHE"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    let unsubscribePlayers = null;

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminDashboard').style.display = 'flex';
            loadAdminPlayerList();
        } else {
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('adminDashboard').style.display = 'none';
            if(unsubscribePlayers) unsubscribePlayers(); 
        }
    });

    function loadAdminPlayerList() {
        const playersRef = collection(db, "players");
        unsubscribePlayers = onSnapshot(playersRef, (snapshot) => {
            const tbody = document.getElementById("adminPlayerList");
            tbody.innerHTML = ""; 
            
            let dataArr = [];
            snapshot.forEach((doc) => {
                const p = doc.data();
                p.win_count = Number(p.win_count) || 0;
                p.kill_count = Number(p.kill_count) || 0;
                p.deposit_rs = Number(p.deposit_rs) || 0;
                p.balance_rs = Number(p.balance_rs) || 0;
                dataArr.push(p);
            });
            dataArr.sort((a, b) => b.win_count - a.win_count);

            dataArr.forEach((player) => {
                const dbStatus = player.status || "Auto";
                let displayStatus = dbStatus;
                let bgClass = "bg-deactive";
                
                if (dbStatus === "Auto") {
                    const hasPlayed = (player.win_count > 0 || player.kill_count > 0 || player.balance_rs > 0 || player.deposit_rs > 0);
                    displayStatus = hasPlayed ? "Auto (Active)" : "Auto (Deact)";
                    bgClass = hasPlayed ? "bg-active" : "bg-deactive";
                } else if (dbStatus === "Active") {
                    bgClass = "bg-active";
                }

                const row = document.createElement("tr");
                row.innerHTML = `
                    <td class="admin-player-name">
                        <strong>${player.name}</strong>
                        ${player.tag ? `<span class="adm-tag">${player.tag}</span>` : ''}
                    </td>
                    <td class="admin-player-mobile" style="color:#aaa;">${player.mobile}</td>
                    <td><span class="status-badge ${bgClass}">${displayStatus}</span></td>
                    <td>${player.win_count}</td>
                    <td>${player.kill_count}</td>
                    <td>₹${player.deposit_rs}</td>
                    <td style="color: #4CAF50;">₹${player.balance_rs}</td>
                    <td class="action-group">
                        <button class="action-btn btn-update" onclick="selectPlayerForUpdate('${player.mobile}', ${player.win_count}, ${player.kill_count}, ${player.deposit_rs}, ${player.balance_rs})">Stats</button>
                        <button class="action-btn btn-edit" onclick="selectPlayerForEdit('${player.mobile}', '${player.name}', '${player.status || 'Auto'}', '${player.tag || ''}')">Edit</button>
                        <button class="action-btn btn-delete" onclick="deletePlayer('${player.mobile}')">Del</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
            searchAdminPlayer();
        });
    }

    window.searchAdminPlayer = function() {
        let filter = document.getElementById('adminSearchInput').value.toUpperCase();
        let rows = document.getElementById("adminPlayerList").getElementsByTagName('tr');
        for (let i = 0; i < rows.length; i++) {
            let nameCell = rows[i].getElementsByClassName("admin-player-name")[0];
            let mobileCell = rows[i].getElementsByClassName("admin-player-mobile")[0];
            if (nameCell || mobileCell) {
                let name = nameCell.textContent || nameCell.innerText;
                let mobile = mobileCell.textContent || mobileCell.innerText;
                if (name.toUpperCase().indexOf(filter) > -1 || mobile.indexOf(filter) > -1) {
                    rows[i].style.display = "";
                } else { rows[i].style.display = "none"; }
            }       
        }
    }

    // Load active scores directly into the editing fields on select
    window.selectPlayerForUpdate = function(mobile, wins, kills, deposit, balance) {
        document.getElementById("updateMobile").value = mobile;
        document.getElementById("setWins").value = Number(wins);
        document.getElementById("setKills").value = Number(kills);
        document.getElementById("setDeposit").value = Number(deposit);
        document.getElementById("setBalance").value = Number(balance);
        document.getElementById("updateSection").scrollIntoView({ behavior: 'smooth' });
    }

    window.selectPlayerForEdit = function(mobile, name, currentStatus, currentTag) {
        document.getElementById("editSection").style.display = "block";
        document.getElementById("editOldMobile").value = mobile;
        document.getElementById("editName").value = name;
        document.getElementById("editMobile").value = mobile;
        document.getElementById("editTag").value = currentTag;
        document.getElementById("editStatus").value = currentStatus;
        document.getElementById("editSection").scrollIntoView({ behavior: 'smooth' });
    }

    window.cancelEdit = function() { document.getElementById("editSection").style.display = "none"; }

    window.deletePlayer = async function(mobile) {
        if(confirm("Delete this player permanently?")) {
            try { await deleteDoc(doc(db, "players", mobile)); } catch(e) { alert("Error deleting."); }
        }
    }

    window.savePlayerProfile = async function() {
        const oldMobile = document.getElementById("editOldMobile").value;
        const newName = document.getElementById("editName").value.trim();
        const newMobile = document.getElementById("editMobile").value.trim();
        const newStatus = document.getElementById("editStatus").value;
        const newTag = document.getElementById("editTag").value.trim();

        if(!newName || !newMobile) return alert("Fields cannot be empty!");

        try {
            if(oldMobile === newMobile) {
                await updateDoc(doc(db, "players", oldMobile), { name: newName, status: newStatus, tag: newTag });
            } else {
                const oldDocRef = doc(db, "players", oldMobile);
                const oldSnap = await getDoc(oldDocRef);
                if(oldSnap.exists()) {
                    const data = oldSnap.data();
                    data.name = newName; data.mobile = newMobile; data.status = newStatus; data.tag = newTag;
                    await setDoc(doc(db, "players", newMobile), data); 
                    await deleteDoc(oldDocRef); 
                }
            }
            alert("Profile Updated!");
            document.getElementById("editSection").style.display = "none";
        } catch(e) { alert("Error updating profile."); }
    }

    window.loginAdmin = async function() {
        try { await signInWithEmailAndPassword(auth, document.getElementById("adminEmail").value, document.getElementById("adminPassword").value); } catch (e) { alert("Login Failed"); }
    }
    window.logoutAdmin = async function() { await signOut(auth); }

    window.registerPlayer = async function() {
        const name = document.getElementById("newName").value.trim();
        const mobile = document.getElementById("newMobile").value.trim();
        const tag = document.getElementById("newTag").value.trim();
        if(!name || !mobile) return alert("Please fill fields!");
        try {
            await setDoc(doc(db, "players", mobile), { name: name, mobile: mobile, win_count: 0, kill_count: 0, deposit_rs: 0, balance_rs: 0, status: "Auto", tag: tag });
            document.getElementById("newName").value = ""; document.getElementById("newMobile").value = ""; document.getElementById("newTag").value = "";
        } catch (e) { alert("Registration failed."); }
    }

    // Direct override execution workflow safely parsing numeric integer formatting values 
    window.updateStats = async function() {
        const mobile = document.getElementById("updateMobile").value.trim();
        if(!mobile) return alert("Select player first!");
        
        try {
            await updateDoc(doc(db, "players", mobile), {
                win_count: Number(document.getElementById("setWins").value) || 0,
                kill_count: Number(document.getElementById("setKills").value) || 0,
                deposit_rs: Number(document.getElementById("setDeposit").value) || 0,
                balance_rs: Number(document.getElementById("setBalance").value) || 0
            });
            alert("Scores Overwritten Successfully!");
            document.getElementById("updateMobile").value = ""; 
            document.getElementById("setWins").value = "0";
            document.getElementById("setKills").value = "0"; 
            document.getElementById("setDeposit").value = "0"; 
            document.getElementById("setBalance").value = "0";
        } catch (e) { alert("Update failed."); }
    }
</script>
</body>
</html>
