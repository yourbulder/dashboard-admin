<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twin Mac - Secure Admin Panel</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #050505; color: #ffffff; padding: 20px; margin: 0;
        }
        .logo-container { text-align: center; margin-bottom: 30px; font-size: 32px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 10px;}
        .logo-icon { color: #ff8c00; font-size: 36px; }
        .logo-text { color: #ffffff; }
        .logo-dot { color: #ff8c00; }

        .container-box { 
            background: #121212; padding: 25px; width: 100%; max-width: 400px; 
            border-radius: 8px; border: 1px solid #333; margin: auto;
        }
        .admin-dashboard { display: none; /* Hidden until logged in */ flex-wrap: wrap; gap: 20px; justify-content: center; }
        
        h3 { color: #ff8c00; margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 10px; }
        input, button { 
            width: 100%; padding: 12px; margin: 10px 0; 
            box-sizing: border-box; border-radius: 5px; border: 1px solid #333; 
            background: #1a1a1a; color: white; font-size: 16px;
        }
        input:focus { outline: none; border-color: #ff8c00; }
        button { background: #ff8c00; color: black; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; }
        button:hover { background: #e67e00; }
        .logout-btn { background: #333; color: white; margin-top: 20px;}
        .logout-btn:hover { background: #555; }
    </style>
</head>
<body>

<div class="logo-container">
    <span class="logo-icon">⚙️</span>
    <span class="logo-text">twin mac admin<span class="logo-dot">.</span></span>
</div>

<div id="loginSection" class="container-box">
    <h3 style="text-align:center;">Admin Login</h3>
    <input type="email" id="adminEmail" placeholder="Admin Email">
    <input type="password" id="adminPassword" placeholder="Password">
    <button onclick="loginAdmin()">Login</button>
</div>

<div id="adminDashboard" class="admin-dashboard">
    <div class="container-box">
        <h3>1. Register New Player</h3>
        <input type="text" id="newName" placeholder="Player Name">
        <input type="text" id="newMobile" placeholder="Mobile Number (Used as ID)">
        <button onclick="registerPlayer()">Register Player</button>
    </div>

    <div class="container-box">
        <h3>2. Update Player Stats</h3>
        <input type="text" id="updateMobile" placeholder="Enter Mobile Number to update">
        <hr style="border: 0; border-top: 1px solid #333; margin: 15px 0;">
        <label style="font-size: 14px; color: #aaa;">Enter amounts to ADD to current score:</label>
        <input type="number" id="addWins" placeholder="Add Win Count (e.g. 1)" value="0">
        <input type="number" id="addKills" placeholder="Add Total Kills" value="0">
        <input type="number" id="addBalance" placeholder="Add Balance in Rs" value="0">
        <button onclick="updateStats()">Update Stats</button>
        <button class="logout-btn" onclick="logoutAdmin()">Logout</button>
    </div>
</div>

<script type="module">
    // We now import Auth modules in addition to Firestore modules
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDZk4FvwMZiuWh4eKokSam20T0VD33OJmw",
      authDomain: "leader-board-2e4df.firebaseapp.com",
      projectId: "leader-board-2e4df",
      storageBucket: "leader-board-2e4df.firebasestorage.app",
      messagingSenderId: "690245888676",
      appId: "1:690245888676:web:7185e88af678a7bae39431",
      measurementId: "G-NGC92PGBHE"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // Auth State Observer - Hides/Shows the dashboard based on login status
    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminDashboard').style.display = 'flex';
        } else {
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('adminDashboard').style.display = 'none';
        }
    });

    // Login Function
    window.loginAdmin = async function() {
        const email = document.getElementById("adminEmail").value;
        const password = document.getElementById("adminPassword").value;
        try {
            await signInWithEmailAndPassword(auth, email, password);
            // Observer above will automatically show the dashboard
        } catch (error) {
            alert("Login Failed: " + error.message);
        }
    }

    // Logout Function
    window.logoutAdmin = async function() {
        try {
            await signOut(auth);
        } catch (error) {
            alert("Error logging out.");
        }
    }

    // Register Player Logic (Same as before)
    window.registerPlayer = async function() {
        const name = document.getElementById("newName").value.trim();
        const mobile = document.getElementById("newMobile").value.trim();
        if(!name || !mobile) return alert("Please fill both Name and Mobile fields!");

        try {
            await setDoc(doc(db, "players", mobile), {
                name: name,
                mobile: mobile,
                win_count: 0,
                kill_count: 0,
                balance_rs: 0
            });
            alert("Player Registered Successfully!");
            document.getElementById("newName").value = "";
            document.getElementById("newMobile").value = "";
        } catch (e) {
            console.error("Error: ", e);
            alert("Registration failed. Ensure you are logged in.");
        }
    }

    // Update Stats Logic (Same as before)
    window.updateStats = async function() {
        const mobile = document.getElementById("updateMobile").value.trim();
        const winsToAdd = parseInt(document.getElementById("addWins").value) || 0;
        const killsToAdd = parseInt(document.getElementById("addKills").value) || 0;
        const balanceToAdd = parseInt(document.getElementById("addBalance").value) || 0;

        if(!mobile) return alert("Please enter the Mobile Number!");

        try {
            const playerRef = doc(db, "players", mobile);
            await updateDoc(playerRef, {
                win_count: increment(winsToAdd),
                kill_count: increment(killsToAdd),
                balance_rs: increment(balanceToAdd)
            });
            alert("Player Stats Updated Successfully!");
            document.getElementById("updateMobile").value = "";
            document.getElementById("addWins").value = "0";
            document.getElementById("addKills").value = "0";
            document.getElementById("addBalance").value = "0";
        } catch (e) {
            console.error("Error: ", e);
            alert("Update failed. Ensure mobile is correct and you are logged in.");
        }
    }
</script>
</body>
</html>
